<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="きらきらレッスン">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffd6e8">
<meta name="description" content="4さいから あそべる 3D おしゃれ・おしごと・おてつだい ゲーム">
<title>きらきら おんなのこレッスン 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%97%3C/text%3E%3C/svg%3E">
<style>
/* =======================================================
   きほん
   ======================================================= */
*, *::before, *::after {
  margin:0; padding:0; box-sizing:border-box;
  -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none;
  -webkit-user-select:none; user-select:none;
}
html, body {
  width:100%; height:100%; overflow:hidden; position:fixed; overscroll-behavior:none;
  background:#ffeaf3; touch-action:none;
  font-family:'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','M PLUS Rounded 1c',
              'Rounded Mplus 1c','IPAGothic','Meiryo',sans-serif;
  color:#6b4f5e;
}
#game-canvas { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; }

:root {
  --pink:#ff6fa5; --pink-l:#ffa1c4; --pink-d:#e0538c;
  --lav:#c9a7ff; --sky:#8fd4ff; --sun:#ffd44d; --mint:#8fe3c8;
  --ink:#6b4f5e; --card:rgba(255,255,255,.94);
  --sh:0 .6vmin 1.6vmin rgba(180,90,140,.22);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);
  --safe-r:env(safe-area-inset-right,0px);
  --btn:min(15vmin,88px);
  --btn-s:min(11vmin,64px);
}

button { font-family:inherit; border:none; cursor:pointer; color:inherit; background:none; }
.hide { display:none !important; }

/* =======================================================
   タイトル
   ======================================================= */
#title {
  position:absolute; inset:0; z-index:80; overflow:hidden;
  background:linear-gradient(175deg,#ffd9ec 0%,#ffeaf3 40%,#e3f2ff 78%,#d7f6ee 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:2.4vmin; transition:opacity .7s ease;
}
#title.gone { opacity:0; pointer-events:none; }
#title .deco { position:absolute; opacity:.75; pointer-events:none; }
#title-logo {
  z-index:3; text-align:center; line-height:1.18; margin-top:-2vmin;
  animation:logoIn 1s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes logoIn { from{transform:scale(.4) rotate(-8deg); opacity:0;} to{transform:none; opacity:1;} }
#title-logo .l1 {
  display:block; font-size:min(11vmin,74px); font-weight:900; color:#fff;
  text-shadow:0 0 0 #fff, .5vmin .5vmin 0 var(--pink), -.3vmin -.3vmin 0 var(--pink),
              .3vmin -.3vmin 0 var(--pink), -.3vmin .3vmin 0 var(--pink),
              0 1.4vmin 2vmin rgba(255,111,165,.5);
  letter-spacing:.02em;
}
#title-logo .l2 {
  display:block; font-size:min(5.4vmin,34px); font-weight:900; color:#8a5fd0; margin-top:1.2vmin;
  text-shadow:.3vmin .3vmin 0 #fff, -.3vmin -.3vmin 0 #fff, .3vmin -.3vmin 0 #fff,
              -.3vmin .3vmin 0 #fff, 0 .8vmin 1.4vmin rgba(255,255,255,.9);
}
#title-logo .l3 {
  display:block; font-size:min(4vmin,24px); font-weight:700; color:#9a7fb8; margin-top:1.2vmin;
  text-shadow:0 .2vmin 0 #fff;
}
#title-sub { z-index:3; display:flex; gap:1.6vmin; font-size:min(6vmin,40px); }
#title-sub span { animation:bob 2.4s ease-in-out infinite; filter:drop-shadow(0 .6vmin .6vmin rgba(200,120,170,.35)); }
#title-sub span:nth-child(2){ animation-delay:.3s } #title-sub span:nth-child(3){ animation-delay:.6s }
@keyframes bob { 0%,100%{transform:translateY(0) rotate(-5deg)} 50%{transform:translateY(-1.6vmin) rotate(5deg)} }

#start-btn {
  z-index:3; font-size:min(6.4vmin,40px); font-weight:900; color:#fff;
  background:linear-gradient(180deg,#ffb0cf,#ff6fa5);
  border-radius:99px; padding:min(3vmin,20px) min(11vmin,64px);
  box-shadow:0 1.4vmin 0 var(--pink-d), 0 2.6vmin 3.4vmin rgba(255,111,165,.45);
  animation:pulse 1.5s ease-in-out infinite; margin-top:1.5vmin;
  border:.5vmin solid #fff;
}
@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.07)} }
#start-btn:active { transform:translateY(1.2vmin) scale(.97); box-shadow:0 .3vmin 0 var(--pink-d); }
#title-tip { z-index:3; font-size:min(3.2vmin,17px); color:#b98aad; margin-top:1vmin; }
#title-reset {
  position:absolute; bottom:calc(var(--safe-b) + 1.4vmin); right:1.6vmin; z-index:4;
  font-size:min(2.8vmin,14px); color:#d5a8c4; padding:1.2vmin 2.4vmin; border-radius:99px;
  background:rgba(255,255,255,.5);
}
.cloud { position:absolute; background:#fff; border-radius:50%; opacity:.85; animation:drift linear infinite; }
@keyframes drift { from{transform:translateX(-40vw)} to{transform:translateX(140vw)} }
.sparkle-deco { position:absolute; font-size:min(5vmin,28px); animation:twinkle 2.6s ease-in-out infinite; }
@keyframes twinkle { 0%,100%{transform:scale(.6) rotate(0); opacity:.35} 50%{transform:scale(1.15) rotate(25deg); opacity:1} }

/* =======================================================
   HUD
   ======================================================= */
#hud { position:absolute; inset:0; z-index:10; pointer-events:none; opacity:0; transition:opacity .5s; }
#hud.on { opacity:1; }

.tap { pointer-events:auto; }

/* まるボタン */
.rbtn {
  pointer-events:auto; width:var(--btn-s); height:var(--btn-s); border-radius:50%;
  background:var(--card); box-shadow:var(--sh); display:flex; align-items:center; justify-content:center;
  font-size:calc(var(--btn-s)*.5); transition:transform .12s; border:.35vmin solid #fff;
}
.rbtn:active { transform:scale(.88); }
.rbtn.off { filter:grayscale(1); opacity:.55; }

#hud-tl { position:absolute; top:calc(var(--safe-t) + 1.4vmin); left:calc(var(--safe-l) + 1.4vmin); display:flex; gap:1.2vmin; }
#hud-tr { position:absolute; top:calc(var(--safe-t) + 1.4vmin); right:calc(var(--safe-r) + 1.4vmin); display:flex; gap:1.2vmin; align-items:flex-start; flex-wrap:wrap; justify-content:flex-end; max-width:46vw; }

.counter {
  pointer-events:auto; background:var(--card); border-radius:99px; box-shadow:var(--sh);
  padding:.9vmin 2.2vmin .9vmin 1.2vmin; display:flex; align-items:center; gap:.7vmin;
  font-size:min(4.4vmin,25px); font-weight:900; border:.35vmin solid #fff; min-height:var(--btn-s);
}
.counter .ic { font-size:min(5vmin,28px); }
#c-star { color:#f0a91e; } #c-heart { color:#ff5f8f; }
.counter.bump { animation:bump .55s cubic-bezier(.2,1.6,.4,1); }
@keyframes bump { 0%{transform:scale(1)} 35%{transform:scale(1.35) rotate(-7deg)} 100%{transform:scale(1)} }

/* おしえて バー */
#task {
  position:absolute; top:calc(var(--safe-t) + 1.4vmin); left:50%; transform:translateX(-50%) translateY(-140%);
  background:linear-gradient(180deg,#fff,#fff3f8); border:.5vmin solid #fff;
  border-radius:99px; box-shadow:0 1vmin 2.4vmin rgba(180,90,140,.28);
  padding:1.2vmin 3.4vmin; display:flex; align-items:center; gap:1.4vmin;
  font-size:min(4.2vmin,24px); font-weight:800; color:var(--ink);
  max-width:min(84vw,720px); transition:transform .45s cubic-bezier(.2,1.5,.4,1); pointer-events:auto;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#task.on { transform:translateX(-50%) translateY(0); }
#task .tic { font-size:min(6vmin,34px); animation:bob 2s ease-in-out infinite; }
#task.mid { top:auto; bottom:calc(var(--safe-b) + 30vmin); }

/* すすみぐあい ドット */
#steps { position:absolute; top:calc(var(--safe-t) + 11vmin); left:50%; transform:translateX(-50%); display:flex; gap:1.2vmin; }
#steps .dot {
  width:min(3.4vmin,20px); height:min(3.4vmin,20px); border-radius:50%;
  background:rgba(255,255,255,.75); box-shadow:0 .3vmin .8vmin rgba(180,90,140,.2); border:.3vmin solid #fff;
  transition:all .3s;
}
#steps .dot.done { background:var(--sun); transform:scale(1.15); }
#steps .dot.now { background:var(--pink); animation:pulse 1s infinite; }

/* したの パネル */
#panel {
  position:absolute; left:0; right:0; bottom:0; padding:1.4vmin calc(var(--safe-r) + 1.4vmin) calc(var(--safe-b) + 1.4vmin) calc(var(--safe-l) + 1.4vmin);
  display:flex; flex-direction:column; align-items:center; gap:1.2vmin; pointer-events:none;
}
.row {
  display:flex; gap:1.4vmin; align-items:center; justify-content:flex-start; pointer-events:auto;
  max-width:100%; overflow-x:auto; overflow-y:hidden; padding:1vmin .6vmin; scrollbar-width:none;
  -webkit-overflow-scrolling:touch;
}
.row::-webkit-scrollbar { display:none; }
.row.center { justify-content:center; }
.row.wrapped { flex-wrap:wrap; justify-content:center; overflow:visible; max-height:34vh; }

/* えらぶ ボタン */
.chip {
  flex:0 0 auto; width:var(--btn); min-width:56px; border-radius:min(4vmin,22px);
  background:var(--card); box-shadow:var(--sh); border:.45vmin solid #fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.2vmin;
  padding:.9vmin .4vmin; transition:transform .14s, box-shadow .14s; position:relative;
}
.chip .ci { font-size:calc(var(--btn)*.44); line-height:1.1; }
.chip .cl { font-size:min(2.4vmin,13px); font-weight:800; color:#a2778e; white-space:nowrap; max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.chip:active { transform:scale(.9); }
.chip.sel { background:linear-gradient(180deg,#fff8c9,#ffe484); box-shadow:0 0 0 .6vmin var(--sun), var(--sh); transform:translateY(-.8vmin); }
.chip.locked { filter:grayscale(.75); opacity:.72; }
.chip .price {
  position:absolute; bottom:-1.2vmin; left:50%; transform:translateX(-50%);
  background:#fff3c4; color:#c98a10; font-size:min(2.2vmin,12px); font-weight:900;
  border-radius:99px; padding:.2vmin 1.2vmin; box-shadow:0 .3vmin .6vmin rgba(0,0,0,.12); white-space:nowrap;
}
.chip .newdot {
  position:absolute; top:-1vmin; right:-1vmin; background:#ff5f6d; color:#fff;
  font-size:min(2.2vmin,12px); font-weight:900; border-radius:99px; padding:.2vmin 1vmin;
}
.chip.big { width:min(20vmin,120px); }
.chip.big .ci { font-size:min(9vmin,54px); }

/* いろ の まる */
.sw {
  flex:0 0 auto; width:min(9vmin,52px); height:min(9vmin,52px); border-radius:50%;
  box-shadow:var(--sh); border:.5vmin solid #fff; transition:transform .12s;
}
.sw:active { transform:scale(.86); }
.sw.sel { box-shadow:0 0 0 .7vmin var(--sun), var(--sh); transform:scale(1.12); }

/* カテゴリ タブ */
#tabs { position:absolute; z-index:12; display:flex; gap:1.2vmin; pointer-events:auto; }
.tab {
  width:min(13vmin,74px); height:min(13vmin,74px); border-radius:min(3.6vmin,20px);
  background:rgba(255,255,255,.86); box-shadow:var(--sh); border:.45vmin solid #fff;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:min(5.6vmin,32px); transition:transform .14s;
}
.tab .tl { font-size:min(2.2vmin,12px); font-weight:800; color:#a2778e; }
.tab.sel { background:linear-gradient(180deg,#ffd9ec,#ffb9d8); transform:scale(1.08); box-shadow:0 0 0 .6vmin var(--pink-l), var(--sh); }
.tab:active { transform:scale(.9); }

/* おおきな フィードバック */
#big {
  position:absolute; top:40%; left:50%; z-index:30; pointer-events:none;
  transform:translate(-50%,-50%) scale(0); opacity:0; font-size:min(26vmin,180px);
}
#big.go { animation:bigPop 1.25s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes bigPop {
  0%{transform:translate(-50%,-50%) scale(0) rotate(-20deg); opacity:0}
  28%{transform:translate(-50%,-50%) scale(1.3) rotate(8deg); opacity:1}
  50%{transform:translate(-50%,-50%) scale(1) rotate(0); opacity:1}
  100%{transform:translate(-50%,-72%) scale(1.05); opacity:0}
}

/* バナー */
#banner {
  position:absolute; top:26%; left:50%; z-index:31; pointer-events:none;
  transform:translate(-50%,-50%) scale(0);
  background:linear-gradient(180deg,#fffdf3,#ffe9a8); border:.6vmin solid #fff;
  border-radius:min(5vmin,28px); padding:min(3vmin,18px) min(7vmin,44px);
  font-size:min(7vmin,42px); font-weight:900; color:#f08a2a; text-align:center; white-space:nowrap;
  box-shadow:0 2vmin 4vmin rgba(240,150,40,.4);
}
#banner.go { animation:bannerPop 2.4s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes bannerPop {
  0%{transform:translate(-50%,-50%) scale(0) rotate(-9deg)}
  16%{transform:translate(-50%,-50%) scale(1.16) rotate(4deg)}
  26%{transform:translate(-50%,-50%) scale(1)}
  80%{transform:translate(-50%,-50%) scale(1); opacity:1}
  100%{transform:translate(-50%,-64%) scale(.92); opacity:0}
}

/* トースト */
#toast {
  position:absolute; bottom:calc(var(--safe-b) + 26vmin); left:50%; transform:translate(-50%,2vmin);
  z-index:32; background:rgba(90,60,80,.9); color:#fff; border-radius:99px;
  padding:1.2vmin 3.4vmin; font-size:min(3.6vmin,20px); font-weight:800;
  opacity:0; transition:opacity .3s, transform .3s; pointer-events:none; white-space:nowrap;
}
#toast.on { opacity:1; transform:translate(-50%,0); }

/* ゆびヒント */
#hint {
  position:absolute; z-index:33; font-size:min(11vmin,66px); pointer-events:none;
  opacity:0; transition:opacity .3s; transform:translate(-22%,-6%);
  filter:drop-shadow(0 .6vmin .8vmin rgba(0,0,0,.3));
}
#hint.on { opacity:1; animation:tapHint 1.1s ease-in-out infinite; }
@keyframes tapHint { 0%,100%{margin-top:0} 50%{margin-top:-2.4vmin} }
#hint-ring {
  position:absolute; z-index:32; pointer-events:none; border-radius:50%;
  border:.7vmin solid var(--sun); width:min(18vmin,110px); height:min(18vmin,110px);
  transform:translate(-50%,-50%); opacity:0;
}
#hint-ring.on { animation:hintRing 1.2s ease-out infinite; }
@keyframes hintRing {
  0%{opacity:.9; transform:translate(-50%,-50%) scale(.5)}
  100%{opacity:0; transform:translate(-50%,-50%) scale(1.5)}
}

/* =======================================================
   オーバーレイ（アルバム・ショップ・けっか・メニュー）
   ======================================================= */
.overlay {
  position:absolute; inset:0; z-index:60; display:none; align-items:center; justify-content:center;
  background:rgba(120,80,140,.42); backdrop-filter:blur(5px); -webkit-backdrop-filter:blur(5px);
  pointer-events:auto; padding:2vmin;
}
.overlay.on { display:flex; animation:fadeIn .3s; }
@keyframes fadeIn { from{opacity:0} to{opacity:1} }
.card {
  background:linear-gradient(180deg,#fffdf8,#fff2f7); border-radius:min(6vmin,34px);
  border:.7vmin solid #fff; padding:min(4vmin,26px);
  width:min(92vw,760px); max-height:88vh; overflow-y:auto; text-align:center;
  box-shadow:0 3vmin 6vmin rgba(90,50,90,.4); animation:cardIn .4s cubic-bezier(.2,1.4,.4,1);
  -webkit-overflow-scrolling:touch;
}
@keyframes cardIn { from{transform:scale(.6) translateY(6vmin); opacity:0} to{transform:none; opacity:1} }
.card h2 { color:var(--pink); font-size:min(6vmin,36px); margin-bottom:1.6vmin; font-weight:900; }
.card .sub { color:#b98aad; font-size:min(3.2vmin,18px); margin-bottom:2.4vmin; }
.bigbtn {
  font-size:min(5vmin,28px); font-weight:900; color:#fff; border-radius:99px;
  padding:min(2.2vmin,14px) min(8vmin,48px); margin:1.2vmin .8vmin 0;
  background:linear-gradient(180deg,#ffb0cf,#ff6fa5); box-shadow:0 1vmin 0 var(--pink-d);
  border:.4vmin solid #fff; display:inline-block;
}
.bigbtn:active { transform:translateY(.8vmin); box-shadow:0 .2vmin 0 var(--pink-d); }
.bigbtn.blue { background:linear-gradient(180deg,#a9dcff,#59b6f5); box-shadow:0 1vmin 0 #3d8dc7; }
.bigbtn.green { background:linear-gradient(180deg,#b7efc9,#5fd08a); box-shadow:0 1vmin 0 #3fa066; }
.bigbtn.gray { background:linear-gradient(180deg,#e3e0e8,#bdb6c7); box-shadow:0 1vmin 0 #948ca3; color:#6b4f5e; }

/* シールアルバム */
#album-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(18vmin,96px),1fr)); gap:1.6vmin; }
.slot {
  aspect-ratio:1; background:#fff; border-radius:min(3vmin,18px); display:flex;
  flex-direction:column; align-items:center; justify-content:center; font-size:min(9vmin,50px);
  box-shadow:inset 0 0 0 .5vmin #ffe0ec, 0 .5vmin 1vmin rgba(180,90,140,.12); position:relative;
}
.slot .sn { font-size:min(2vmin,11px); font-weight:800; color:#c79bb4; margin-top:.3vmin; }
.slot.locked { filter:grayscale(1); opacity:.3; }
.slot.newly { animation:stickerNew .9s cubic-bezier(.2,1.6,.4,1); }
@keyframes stickerNew { 0%{transform:scale(0) rotate(-200deg)} 65%{transform:scale(1.35)} 100%{transform:scale(1)} }

/* ショップ */
#shop-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(26vmin,140px),1fr)); gap:1.8vmin; }
.shop-item {
  background:#fff; border-radius:min(3.4vmin,20px); padding:1.6vmin 1vmin;
  box-shadow:0 .8vmin 1.6vmin rgba(180,90,140,.16); position:relative;
  display:flex; flex-direction:column; align-items:center; gap:.5vmin; border:.4vmin solid #fff;
}
.shop-item .si { font-size:min(8vmin,46px); }
.shop-item .snm { font-size:min(2.6vmin,14px); font-weight:800; color:#a2778e; }
.shop-item .sp { font-size:min(3vmin,16px); font-weight:900; color:#f0a91e; }
.shop-item.bought { background:linear-gradient(180deg,#eaffef,#d6f8e2); }
.shop-item.cant { opacity:.6; }
.shop-item:active { transform:scale(.94); }

/* けっか */
#res-stars { font-size:min(16vmin,96px); letter-spacing:1vmin; margin:1vmin 0; }
#res-stars span { display:inline-block; animation:starDrop .6s cubic-bezier(.2,1.6,.4,1) both; }
@keyframes starDrop { from{transform:scale(0) rotate(-180deg); opacity:0} to{transform:none; opacity:1} }
#res-reward { font-size:min(4.4vmin,24px); font-weight:900; color:#f0a91e; margin:1.4vmin 0; }
#res-sticker { font-size:min(18vmin,110px); margin:1vmin 0; animation:stickerNew 1s cubic-bezier(.2,1.6,.4,1); }

/* メニュー（おでかけ） */
#menu-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(24vmin,128px),1fr)); gap:1.8vmin; }
.dest {
  background:#fff; border-radius:min(3.6vmin,22px); padding:1.8vmin .8vmin;
  box-shadow:0 .8vmin 1.6vmin rgba(180,90,140,.16); border:.45vmin solid #fff;
  display:flex; flex-direction:column; align-items:center; gap:.5vmin;
}
.dest .di { font-size:min(9vmin,52px); }
.dest .dn { font-size:min(2.8vmin,15px); font-weight:800; color:#a2778e; }
.dest .dc { font-size:min(2.2vmin,12px); font-weight:800; color:#cfa8c2; }
.dest:active { transform:scale(.93); }
.dest.g-osha { background:linear-gradient(180deg,#fff,#ffe9f4); }
.dest.g-shigo { background:linear-gradient(180deg,#fff,#fff3dc); }
.dest.g-tetsu { background:linear-gradient(180deg,#fff,#e6f7ff); }
.dest.g-etc { background:linear-gradient(180deg,#fff,#f0eaff); }

/* せってい の トグル */
.opt-row { display:flex; align-items:center; justify-content:space-between; gap:2vmin; padding:1.4vmin 1vmin; border-bottom:.3vmin dashed #ffd9ea; font-size:min(3.6vmin,20px); font-weight:800; }
.toggle { width:min(16vmin,88px); height:min(8vmin,44px); border-radius:99px; background:#e0d8e6; position:relative; transition:background .25s; flex:0 0 auto; }
.toggle.on { background:#7fd8a0; }
.toggle::after { content:''; position:absolute; top:8%; left:4%; width:44%; height:84%; border-radius:50%; background:#fff; transition:left .25s; box-shadow:0 .3vmin .6vmin rgba(0,0,0,.2); }
.toggle.on::after { left:52%; }

/* =======================================================
   よこがめん の ちょうせい
   ======================================================= */
#tabs {
  top:50%; right:calc(var(--safe-r) + 1.4vmin); transform:translateY(-50%); flex-direction:column;
  max-height:74vh; overflow-y:auto; overflow-x:hidden; padding:.6vmin; scrollbar-width:none;
}
#tabs::-webkit-scrollbar { display:none; }
body.portrait #task { top:calc(var(--safe-t) + 11vmin); max-width:94vw; }
body.portrait #steps { top:calc(var(--safe-t) + 21vmin); }
body.portrait #tabs {
  top:calc(var(--safe-t) + 25vmin); bottom:auto; right:auto; left:50%;
  transform:translateX(-50%); flex-direction:row;
  max-height:none; max-width:96vw; overflow-x:auto; overflow-y:hidden;
}
body.portrait #panel { padding-right:calc(var(--safe-r) + 1.4vmin); }
body.portrait #task.mid { bottom:calc(var(--safe-b) + 40vmin); }

body:not(.portrait) #panel { padding-right:calc(var(--safe-r) + 17vmin); }
@media (orientation:landscape) and (max-height:560px) {
  :root { --btn:min(19vmin,84px); --btn-s:min(14vmin,58px); }
  #panel { flex-direction:column; }
  .row.wrapped { max-height:30vh; }
}
@media (orientation:portrait) {
  :root { --btn:min(17vmin,96px); --btn-s:min(13vmin,66px); }
}

/* ローディング */
#loading {
  position:absolute; inset:0; z-index:90; background:#ffeaf3;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3vmin;
  transition:opacity .5s;
}
#loading.gone { opacity:0; pointer-events:none; }
#loading .lspin { font-size:min(18vmin,110px); animation:spin 1.6s linear infinite; }
@keyframes spin { to{transform:rotate(360deg)} }
#loading .ltx { font-size:min(4.4vmin,24px); font-weight:900; color:var(--pink); }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<!-- ================= HUD ================= -->
<div id="hud">
  <div id="hud-tl">
    <button class="rbtn tap" id="btn-back" title="もどる">🏠</button>
    <button class="rbtn tap" id="btn-menu" title="おでかけ">🗺️</button>
  </div>

  <div id="hud-tr">
    <div class="counter tap" id="c-star"><span class="ic">⭐</span><span id="v-star">0</span></div>
    <div class="counter tap" id="c-heart"><span class="ic">💖</span><span id="v-heart">0</span></div>
    <button class="rbtn tap" id="btn-album" title="シール">📔</button>
    <button class="rbtn tap" id="btn-opt" title="せってい">⚙️</button>
  </div>

  <div id="task"><span class="tic">✨</span><span id="task-tx">ようこそ！</span></div>
  <div id="steps"></div>

  <div id="tabs"></div>

  <div id="panel">
    <div class="row center" id="row-2"></div>
    <div class="row center" id="row-1"></div>
    <div class="row center" id="row-0"></div>
  </div>
</div>

<div id="big"></div>
<div id="banner"></div>
<div id="toast"></div>
<div id="hint">👆</div>
<div id="hint-ring"></div>

<!-- ================= オーバーレイ ================= -->
<div class="overlay" id="ov-album">
  <div class="card">
    <h2>📔 シールアルバム</h2>
    <div class="sub" id="album-count"></div>
    <div id="album-grid"></div>
    <button class="bigbtn" data-close="ov-album">とじる</button>
  </div>
</div>

<div class="overlay" id="ov-shop">
  <div class="card">
    <h2>🛍️ きらきらショップ</h2>
    <div class="sub" id="shop-info"></div>
    <div id="shop-grid"></div>
    <button class="bigbtn" data-close="ov-shop">とじる</button>
  </div>
</div>

<div class="overlay" id="ov-result">
  <div class="card">
    <h2 id="res-title">できたね！</h2>
    <div id="res-stars"></div>
    <div id="res-sticker" class="hide"></div>
    <div id="res-reward"></div>
    <div class="sub" id="res-msg"></div>
    <button class="bigbtn" id="res-again">🔁 もういっかい</button>
    <button class="bigbtn blue" id="res-home">🏠 まちへ</button>
  </div>
</div>

<div class="overlay" id="ov-menu">
  <div class="card">
    <h2>🗺️ どこへ いく？</h2>
    <div class="sub">すきな ばしょを えらんでね</div>
    <div id="menu-grid"></div>
    <button class="bigbtn gray" data-close="ov-menu">とじる</button>
  </div>
</div>

<div class="overlay" id="ov-opt">
  <div class="card">
    <h2>⚙️ せってい</h2>
    <div class="opt-row"><span>🔊 おと</span><div class="toggle" id="tg-sound"></div></div>
    <div class="opt-row"><span>🗣️ こえ</span><div class="toggle" id="tg-voice"></div></div>
    <div class="opt-row"><span>👆 おてほん</span><div class="toggle" id="tg-hints"></div></div>
    <div class="sub" style="margin-top:2vmin">きらきら おんなのこレッスン 3D</div>
    <button class="bigbtn" data-close="ov-opt">とじる</button>
  </div>
</div>

<!-- ================= タイトル ================= -->
<div id="title">
  <div id="title-logo">
    <span class="l1">きらきら</span>
    <span class="l2">おんなのこレッスン 3D</span>
    <span class="l3">オシャレ・おしごと・おてつだい だいすき！</span>
  </div>
  <div id="title-sub"><span>👗</span><span>🎂</span><span>🧹</span></div>
  <button id="start-btn">▶ はじめる</button>
  <div id="title-tip">がめんの どこでも タッチ してね</div>
  <button id="title-reset">さいしょから</button>
</div>

<div id="loading"><div class="lspin">🌸</div><div class="ltx">よみこみちゅう…</div></div>
