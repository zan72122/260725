<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script></head><body style="margin:0;background:#000">
<canvas id="c" width="960" height="600"></canvas>
<script type="module">
import * as THREE from 'three';
import { LightingRig } from './src/engine/lighting.js';
import { Room } from './src/world/room.js';
const yield_ = () => new Promise(r=>setTimeout(r,0));
window.__READY__ = false; window.__ERR__ = null;
const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 960/600, 0.1, 60);
const lighting = new LightingRig(renderer, scene); lighting.apply('day');
const room = new Room({ tier: 2 }); scene.add(room.group);
const ctx = { scene, camera, renderer, lighting, tier: 2 };
try { room.build(ctx); } catch(e) { window.__ERR__ = e.message + '\n' + e.stack; }
window.setView = (p, t, fov) => { camera.fov = fov||38; camera.position.set(...p); camera.lookAt(...t); camera.updateProjectionMatrix(); };
window.setView([0,1.5,3.6],[0,0.85,-0.6]);
window.step = (n) => { for (let i=0;i<n;i++){ lighting.update(1/60); room.update(1/60, ctx); } renderer.render(scene,camera); return renderer.info.render.calls; };
window.room = room; window.lighting = lighting;
window.__READY__ = true;
</script></body></html>
