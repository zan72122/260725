<!doctype html><html><head><meta charset="utf-8"><title>room test</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head><body style="margin:0">
<canvas id="c" width="800" height="500"></canvas>
<script type="module">
const yield_ = () => new Promise(r=>setTimeout(r,0));
const mark = async (m) => { console.log('STAGE ' + m + ' @' + Math.round(performance.now()) + 'ms'); await yield_(); };
import * as THREE from 'three';
import { LightingRig } from './src/engine/lighting.js';
import { Room } from './src/world/room.js';

const log = [];
window.__PROGRESS__='start';
window.__RESULT__ = { ok: false, log };
(async () => {
try {
  await mark('boot');
  const canvas = document.getElementById('c');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.VSMShadowMap;
  renderer.toneMapping = THREE.AgXToneMapping;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 800 / 500, 0.1, 60);
  camera.position.set(0, 1.55, 3.5);
  camera.lookAt(0, 0.9, -0.4);
  await mark('renderer');
  const lighting = new LightingRig(renderer, scene);
  lighting.apply('day');
  await mark('lighting');

  const room = new Room({ tier: 2, fx: null });
  scene.add(room.group);
  const ctx = { scene, camera, renderer, lighting, tier: 2 };
  room.build(ctx);
  await mark('room.build');
  log.push('built');

  // exercise the API
  const anchors = ['crib','tub','highchair','playmat','wardrobe','window','shelf','toybox','rug','table'];
  const missing = anchors.filter(a => !room.anchor(a));
  log.push('anchors missing: ' + JSON.stringify(missing));
  log.push('pickables: ' + room.pickables().filter(Boolean).length);
  log.push('clutter(true) -> ' + room.clutter(true));

  const step = (n, dt = 1/60) => { for (let i=0;i<n;i++){ lighting.update(dt); room.update(dt, ctx); renderer.render(scene, camera);} };
  step(1); await mark('firstRender');
  step(19);
  await mark('20frames');
  log.push('calls@day ' + renderer.info.render.calls + ' tris ' + renderer.info.render.triangles);

  room.setWeather('rain'); step(10);
  log.push('calls@rain ' + renderer.info.render.calls);
  room.setWeather('snow'); step(10);
  log.push('calls@snow ' + renderer.info.render.calls);
  room.setWeather('clear');
  room.setCurtains(0); step(40);
  log.push('calls@curtainsClosed ' + renderer.info.render.calls);
  room.setCurtains(1); step(40);
  room.setMood('golden'); lighting.transitionTo('golden', 0.2); step(30);
  log.push('calls@golden ' + renderer.info.render.calls);
  room.setMood('night'); lighting.transitionTo('night', 0.2); step(40);
  log.push('calls@night ' + renderer.info.render.calls);
  room.setLamp(true); step(10);
  room.clutter(false); step(60);
  log.push('calls@clean ' + renderer.info.render.calls);
  room.onState({ weather: 'rain', timeOfDay: 'day', mess: 5, curtains: 0.5, lamp: false });
  step(30);
  log.push('calls@final ' + renderer.info.render.calls);
  room.reset(); step(20);
  log.push('geometries ' + renderer.info.memory.geometries + ' textures ' + renderer.info.memory.textures + ' programs ' + renderer.info.programs.length);

  // bounding box sanity
  const box = new THREE.Box3().setFromObject(room.group);
  log.push('bbox ' + JSON.stringify({min: box.min.toArray().map(v=>+v.toFixed(2)), max: box.max.toArray().map(v=>+v.toFixed(2))}));
  window.__RESULT__.ok = true;
} catch (e) {
  log.push('ERROR ' + e.message + '\n' + e.stack);
  console.log('ERROR ' + e.message);
}
})();
</script></body></html>
