<!doctype html><html><head><meta charset="utf-8">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script></head><body style="margin:0">
<canvas id="c" width="640" height="400"></canvas>
<script type="module">
import * as THREE from 'three';
import { LightingRig } from './src/engine/lighting.js';
import { Room } from './src/world/room.js';
const log = [];
window.__RESULT__ = { ok:false, log };
const yield_ = () => new Promise(r=>setTimeout(r,0));
(async () => {
try {
  const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('c') });
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.VSMShadowMap;
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(38, 1.6, 0.1, 60);
  camera.position.set(0,1.55,3.5); camera.lookAt(0,0.9,-0.4);
  const lighting = new LightingRig(renderer, scene); lighting.apply('day');
  const room = new Room({ tier:2 }); scene.add(room.group);
  const ctx = { scene, camera, renderer, lighting, tier:2 };
  const t0 = performance.now();
  room.build(ctx);
  log.push('build ms ' + Math.round(performance.now()-t0));
  await yield_();
  let vis=0, cast=0, tris=0; const casters=[], drawn=[];
  room.group.traverse(o=>{
    if ((o.isMesh || o.isPoints) && o.visible) {
      vis++; drawn.push(o.name||o.type);
      if (o.castShadow) { cast++; casters.push(o.name||o.type); }
      const g=o.geometry; if(g&&g.attributes.position) tris += (g.index?g.index.count:g.attributes.position.count)/3 * (o.isInstancedMesh?o.count:1);
    }
  });
  log.push('visible meshes ' + vis + ', casters ' + cast + ', tris(scene) ' + Math.round(tris));
  log.push('DRAWN: ' + drawn.join(', '));
  log.push('CASTERS: ' + casters.join(', '));
  room.update(1/60, ctx); renderer.render(scene,camera);
  log.push('render calls ' + renderer.info.render.calls + ' tris ' + renderer.info.render.triangles);
  window.__RESULT__.ok = true;
} catch(e) { log.push('ERROR '+e.message+'\n'+e.stack); }
})();
</script></body></html>
