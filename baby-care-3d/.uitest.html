<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffe8f2">
<meta name="color-scheme" content="light">
<meta name="description" content="4さいからのあかちゃんおせわゲーム。ごはん・おふろ・きせかえ・あそぶ・ねんね。">
<title>あかちゃん おせわランド 3D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23ff7fae'/%3E%3Ccircle cx='23' cy='29' r='4' fill='%23fff'/%3E%3Ccircle cx='41' cy='29' r='4' fill='%23fff'/%3E%3Cpath d='M22 41c3 5 16 5 20 0' stroke='%23fff' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="./src/ui/hud.css">

<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
}}
</script>
</head>

<body data-mood="day">

<canvas id="game-canvas"></canvas>

<!-- ============================================================ title === -->
<div id="title-screen">
  <!-- Masked scenery: a soft oval hole in the middle reveals the real 3D
       nursery behind, so the game itself is the hero image. -->
  <div class="title__scenery" aria-hidden="true">
    <div class="title__sky"></div>
    <div class="title__sun"></div>

    <div class="cloud cloud--far"  style="width:26vmin;height:7vmin;top:9%;  animation-duration:74s; animation-delay:-8s"></div>
    <div class="cloud cloud--far"  style="width:34vmin;height:8vmin;top:26%; animation-duration:96s; animation-delay:-52s"></div>
    <div class="cloud cloud--far"  style="width:22vmin;height:6vmin;top:58%; animation-duration:88s; animation-delay:-30s"></div>
    <div class="cloud"             style="width:30vmin;height:8.5vmin;top:16%;animation-duration:58s; animation-delay:-26s"></div>
    <div class="cloud"             style="width:24vmin;height:7vmin;top:44%; animation-duration:64s; animation-delay:-4s"></div>
    <div class="cloud cloud--near" style="width:42vmin;height:11vmin;top:70%;animation-duration:46s; animation-delay:-18s"></div>
    <div class="cloud cloud--near" style="width:36vmin;height:9.5vmin;top:85%;animation-duration:40s;animation-delay:-33s"></div>

    <div class="bokeh" style="width:2.6vmin;height:2.6vmin;left:8%; animation-duration:15s;animation-delay:-2s"></div>
    <div class="bokeh" style="width:1.6vmin;height:1.6vmin;left:17%;animation-duration:19s;animation-delay:-9s"></div>
    <div class="bokeh" style="width:3.4vmin;height:3.4vmin;left:26%;animation-duration:23s;animation-delay:-14s"></div>
    <div class="bokeh" style="width:2vmin;  height:2vmin;  left:38%;animation-duration:17s;animation-delay:-6s"></div>
    <div class="bokeh" style="width:1.4vmin;height:1.4vmin;left:47%;animation-duration:21s;animation-delay:-16s"></div>
    <div class="bokeh" style="width:2.8vmin;height:2.8vmin;left:58%;animation-duration:16s;animation-delay:-11s"></div>
    <div class="bokeh" style="width:1.8vmin;height:1.8vmin;left:67%;animation-duration:24s;animation-delay:-3s"></div>
    <div class="bokeh" style="width:3vmin;  height:3vmin;  left:76%;animation-duration:18s;animation-delay:-13s"></div>
    <div class="bokeh" style="width:2.2vmin;height:2.2vmin;left:86%;animation-duration:22s;animation-delay:-7s"></div>
    <div class="bokeh" style="width:1.6vmin;height:1.6vmin;left:94%;animation-duration:20s;animation-delay:-19s"></div>
  </div>
  <div class="title__vignette" aria-hidden="true"></div>

  <div class="title__content">
    <h1 class="logo">
      <span class="logo__line logo__l1" data-t="あかちゃん">あかちゃん</span>
      <span class="logo__line logo__l2" data-t="おせわランド">おせわランド</span>
      <span class="logo__sub">3D</span>
      <span class="logo__shine" aria-hidden="true"></span>
    </h1>

    <div class="title__spacer"></div>

    <div style="display:grid;justify-items:center">
      <button id="start-btn" class="start" type="button" aria-label="あそぶ">
        <span class="start__face">
          <span class="start__icon" data-icon="play"></span>
          <span class="start__text">あそぶ！</span>
        </span>
      </button>
      <p class="title__hint">タップしてはじめよう</p>
    </div>
  </div>
</div>

<!-- ============================================================== HUD === -->
<div id="hud">

  <div class="hud-top">
    <div class="meter-tray" id="meters">
      <div class="meter" data-meter="food">
        <span class="meter__icon" data-icon="apple"></span>
        <span class="meter__body">
          <span class="meter__label">おなか</span>
          <span class="meter__track"><span class="meter__fill"><i class="meter__wobble"></i></span></span>
        </span>
      </div>
      <div class="meter" data-meter="clean">
        <span class="meter__icon" data-icon="bubble"></span>
        <span class="meter__body">
          <span class="meter__label">きれい</span>
          <span class="meter__track"><span class="meter__fill"><i class="meter__wobble"></i></span></span>
        </span>
      </div>
      <div class="meter" data-meter="happy">
        <span class="meter__icon" data-icon="smile"></span>
        <span class="meter__body">
          <span class="meter__label">ごきげん</span>
          <span class="meter__track"><span class="meter__fill"><i class="meter__wobble"></i></span></span>
        </span>
      </div>
      <div class="meter" data-meter="energy">
        <span class="meter__icon" data-icon="spark"></span>
        <span class="meter__body">
          <span class="meter__label">げんき</span>
          <span class="meter__track"><span class="meter__fill"><i class="meter__wobble"></i></span></span>
        </span>
      </div>
    </div>

    <div class="hud-right">
      <div class="star-box" id="star-box">
        <span class="star-box__icon" data-icon="star"></span>
        <span class="star-box__count" id="star-count">0</span>
      </div>
      <button class="round-btn" id="book-btn" type="button" aria-label="シールずかん">
        <span data-icon="book"></span>
        <span class="round-btn__pip" id="book-pip">1</span>
      </button>
      <button class="round-btn" id="sound-btn" type="button" aria-label="おと">
        <span data-icon="speakerOn"></span>
      </button>
    </div>
  </div>

  <div class="ctx-tray" id="ctx-tray"></div>

  <div class="prompt" id="prompt">
    <span class="prompt__icon" data-icon="heart"></span>
    <span class="prompt__text" id="prompt-text"></span>
    <span class="prompt__arrow" data-icon="arrowDown"></span>
  </div>

  <div class="act-bar" id="act-bar">
    <button class="act" type="button" data-act="feed" aria-label="ごはん">
      <span class="act__face"><span class="act__icon" data-icon="bottle"></span></span>
      <span class="act__label">ごはん</span>
      <span class="act__badge" data-icon="exclamation"></span>
    </button>
    <button class="act" type="button" data-act="bath" aria-label="おふろ">
      <span class="act__face"><span class="act__icon" data-icon="bathtub"></span></span>
      <span class="act__label">おふろ</span>
      <span class="act__badge" data-icon="exclamation"></span>
    </button>
    <button class="act" type="button" data-act="dress" aria-label="きせかえ">
      <span class="act__face"><span class="act__icon" data-icon="onesie"></span></span>
      <span class="act__label">きせかえ</span>
      <span class="act__badge" data-icon="exclamation"></span>
    </button>
    <button class="act" type="button" data-act="play" aria-label="あそぶ">
      <span class="act__face"><span class="act__icon" data-icon="balloon"></span></span>
      <span class="act__label">あそぶ</span>
      <span class="act__badge" data-icon="exclamation"></span>
    </button>
    <button class="act" type="button" data-act="sleep" aria-label="ねんね">
      <span class="act__face"><span class="act__icon" data-icon="moon"></span></span>
      <span class="act__label">ねんね</span>
      <span class="act__badge" data-icon="exclamation"></span>
    </button>
  </div>

  <!-- ======================================================== layers === -->
  <div class="toast-layer" id="toast-layer"></div>
  <div class="fx-layer" id="label-layer"></div>
  <div class="fx-layer" id="fx-layer"></div>

  <!-- ================================================== sticker album === -->
  <div class="album" id="album" role="dialog" aria-label="シールずかん" aria-modal="true">
    <div class="album__card">
      <div class="album__head">
        <div class="album__title"><span data-icon="book"></span><span>シールずかん</span></div>
        <button class="album__close" id="album-close" type="button" aria-label="とじる"><span data-icon="close"></span></button>
      </div>
      <div class="album__pages" id="album-pages"></div>
      <div class="album__foot">
        <span data-icon="star" style="width:clamp(20px,4vmin,34px);height:clamp(20px,4vmin,34px);flex:0 0 auto"></span>
        <div class="album__progress"><i id="album-bar"></i></div>
        <span class="album__count" id="album-count">0 / 16</span>
      </div>
    </div>
  </div>
</div><!-- /#hud -->

<script type="module" src="./.uitest.js"></script>
</body>
</html>
