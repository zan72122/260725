<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6ecff">
<title>にじいろ宝石工房</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  html, body { width:100%; height:100%; overflow:hidden; position:fixed; background:#f6ecff; touch-action:none;
    font-family:'Hiragino Maru Gothic ProN','ヒラギノ丸ゴ ProN W4','M PLUS Rounded 1c','Comic Sans MS',sans-serif; }
  #game-canvas { position:absolute; top:0; left:0; width:100%; height:100%; display:block; touch-action:none; }

  /* ============ タイトル ============ */
  #title-screen {
    position:absolute; inset:0; z-index:50; overflow:hidden;
    background:linear-gradient(180deg,#ffe6f7 0%,#f3e8ff 45%,#dff2ff 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3.5vmin;
    transition:opacity .6s ease;
  }
  #title-screen.hidden { opacity:0; pointer-events:none; }
  #title-logo {
    font-size:9vmin; font-weight:bold; color:#a86fd6; text-align:center; line-height:1.25; z-index:2;
    text-shadow:0 .8vmin 0 #fff, 0 1.4vmin 2.4vmin rgba(168,111,214,.35);
  }
  #title-logo .sub { display:block; font-size:4vmin; color:#5fb8e6; margin-top:1vmin; text-shadow:0 .5vmin 0 #fff; }
  #title-gem { font-size:24vmin; line-height:1; z-index:2; animation:floaty 2.6s ease-in-out infinite;
    filter:drop-shadow(0 2vmin 2.4vmin rgba(140,90,200,.35)); }
  @keyframes floaty { 0%,100%{transform:translateY(0) rotate(-5deg);} 50%{transform:translateY(-3vmin) rotate(5deg);} }
  #start-btn {
    font-family:inherit; font-size:6vmin; font-weight:bold; color:#fff; border:none; cursor:pointer; z-index:2;
    background:linear-gradient(180deg,#cf9ff0,#a86fd6);
    border-radius:6vmin; padding:3vmin 10vmin; box-shadow:0 1.4vmin 0 #8a51b8, 0 2.4vmin 3vmin rgba(140,90,200,.4);
    animation:pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.07);} }
  #start-btn:active { transform:translateY(1vmin) scale(.98); box-shadow:0 .4vmin 0 #8a51b8; }
  .sparkle-deco { position:absolute; font-size:6vmin; opacity:.75; animation:twinkle 2.4s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{transform:scale(.7) rotate(0deg); opacity:.35;} 50%{transform:scale(1.15) rotate(20deg); opacity:.95;} }

  /* ============ HUD ============ */
  #hud { position:absolute; inset:0; z-index:10; pointer-events:none; opacity:0; transition:opacity .6s; }
  #hud.visible { opacity:1; }

  #top-left { position:absolute; top:calc(env(safe-area-inset-top,0px) + 1.4vmin); left:1.6vmin; display:flex; gap:1.4vmin; }
  .round-btn {
    pointer-events:auto; width:10vmin; height:10vmin; min-width:50px; min-height:50px; border:none; cursor:pointer;
    border-radius:50%; background:rgba(255,255,255,.9); font-size:5vmin;
    box-shadow:0 .6vmin 1.4vmin rgba(120,80,160,.22); display:flex; align-items:center; justify-content:center;
  }
  .round-btn:active { transform:scale(.9); }
  .round-btn.off { opacity:.45; }

  #counter {
    position:absolute; top:calc(env(safe-area-inset-top,0px) + 1.4vmin); right:1.6vmin;
    background:rgba(255,255,255,.9); border-radius:3.4vmin; padding:1.2vmin 2.4vmin;
    box-shadow:0 .6vmin 1.4vmin rgba(120,80,160,.22); text-align:center; min-width:26vmin; max-width:180px;
  }
  #counter .row { display:flex; align-items:center; justify-content:center; gap:.8vmin; font-size:5vmin; font-weight:bold; color:#8a51b8; }
  #shine-bar { height:1.8vmin; min-height:8px; background:#eee3f6; border-radius:1vmin; overflow:hidden; margin-top:.8vmin; }
  #shine-fill { height:100%; width:0%; border-radius:1vmin; transition:width .5s ease;
    background:linear-gradient(90deg,#ff9ecb,#ffd76e,#8de8c0,#8ab6ff,#c99bf0); }
  #next-hint { font-size:2.8vmin; color:#a98cc4; margin-top:.5vmin; }

  /* いろパレット + あたらしい石 */
  #bottom-bar {
    position:absolute; left:0; right:0; bottom:calc(env(safe-area-inset-bottom,0px) + 1.6vmin);
    display:flex; align-items:center; justify-content:center; gap:1.6vmin; flex-wrap:wrap; pointer-events:none;
  }
  #palette {
    display:flex; gap:1.2vmin; background:rgba(255,255,255,.82); border-radius:6vmin; padding:1.2vmin 1.6vmin;
    box-shadow:0 .8vmin 1.8vmin rgba(120,80,160,.2); pointer-events:auto;
  }
  .color-btn {
    width:8.4vmin; height:8.4vmin; min-width:38px; min-height:38px; max-width:56px; max-height:56px;
    border:none; border-radius:50%; cursor:pointer; box-shadow:inset 0 -.6vmin 1vmin rgba(0,0,0,.12), 0 .4vmin .8vmin rgba(0,0,0,.15);
    transition:transform .15s;
  }
  .color-btn.selected { outline:.7vmin solid #ffd76e; transform:scale(1.12); }
  .color-btn:active { transform:scale(.88); }
  #new-btn {
    pointer-events:auto; border:none; cursor:pointer; font-family:inherit; font-size:3.6vmin; font-weight:bold; color:#8a51b8;
    background:rgba(255,255,255,.9); border-radius:6vmin; padding:1.8vmin 3vmin; min-height:50px;
    box-shadow:0 .8vmin 1.8vmin rgba(120,80,160,.2);
  }
  #new-btn:active { transform:scale(.94); }

  /* ヒント吹き出し */
  #hint {
    position:absolute; left:50%; top:9%; transform:translate(-50%,0) scale(.8); opacity:0;
    background:rgba(255,255,255,.94); color:#8a51b8; font-size:4.4vmin; font-weight:bold; text-align:center;
    border-radius:4vmin; padding:2vmin 4vmin; box-shadow:0 1.2vmin 2.4vmin rgba(120,80,160,.25);
    transition:opacity .4s, transform .4s; pointer-events:none; line-height:1.4;
  }
  #hint.show { opacity:1; transform:translate(-50%,0) scale(1); animation:hintBob 2s ease-in-out infinite; }
  @keyframes hintBob { 0%,100%{margin-top:0;} 50%{margin-top:-1.4vmin;} }

  /* ごほうびバナー */
  #banner {
    position:absolute; left:50%; top:34%; transform:translate(-50%,-50%) scale(0); z-index:30; pointer-events:none;
    background:linear-gradient(180deg,#fff8ff,#ffe9f8); border-radius:5vmin; padding:3vmin 5vmin;
    font-size:5.4vmin; font-weight:bold; color:#c05fa5; text-align:center; max-width:88vw; line-height:1.35;
    box-shadow:0 2vmin 5vmin rgba(200,110,180,.4);
  }
  #banner.show { animation:bannerPop 3s ease forwards; }
  @keyframes bannerPop {
    0%{transform:translate(-50%,-50%) scale(0) rotate(-8deg); opacity:0;}
    14%{transform:translate(-50%,-50%) scale(1.14) rotate(3deg); opacity:1;}
    24%{transform:translate(-50%,-50%) scale(1); opacity:1;}
    82%{transform:translate(-50%,-50%) scale(1); opacity:1;}
    100%{transform:translate(-50%,-70%) scale(.92); opacity:0;}
  }

  /* かくにん（あたらしい石） */
  #confirm {
    position:absolute; inset:0; z-index:40; background:rgba(120,80,160,.4); backdrop-filter:blur(3px);
    display:none; align-items:center; justify-content:center; pointer-events:auto;
  }
  #confirm.open { display:flex; }
  #confirm-card {
    background:linear-gradient(180deg,#fffdff,#f6ecff); border-radius:5vmin; padding:4vmin 5vmin; text-align:center;
    box-shadow:0 3vmin 6vmin rgba(90,50,130,.35); max-width:88vw;
  }
  #confirm-card p { font-size:5vmin; color:#8a51b8; font-weight:bold; margin-bottom:3vmin; line-height:1.4; }
  #confirm-card .btns { display:flex; gap:2.4vmin; justify-content:center; }
  #confirm-card button {
    font-family:inherit; font-size:4.6vmin; font-weight:bold; color:#fff; border:none; cursor:pointer;
    border-radius:4vmin; padding:2vmin 6vmin; min-height:56px;
  }
  #confirm-yes { background:linear-gradient(180deg,#ffb0d8,#ff7ab8); box-shadow:0 1vmin 0 #d94f92; }
  #confirm-no { background:linear-gradient(180deg,#b9d6ff,#7fb0ff); box-shadow:0 1vmin 0 #4f7fd9; }
  #confirm-card button:active { transform:translateY(.8vmin); box-shadow:none; }

  /* 横長のちいさい画面 */
  @media (orientation:landscape) and (max-height:540px) {
    #bottom-bar { gap:1.2vmin; }
    .color-btn { width:7vmin; height:7vmin; }
    #hint { top:7%; font-size:3.6vmin; }
    #counter { min-width:22vmin; }
  }
</style>
</head>
<body>
<canvas id="game-canvas"></canvas>

<div id="title-screen">
  <div class="sparkle-deco" style="left:12%; top:18%;">✨</div>
  <div class="sparkle-deco" style="right:14%; top:24%; animation-delay:.5s;">🌈</div>
  <div class="sparkle-deco" style="left:18%; bottom:20%; animation-delay:1s;">⭐</div>
  <div class="sparkle-deco" style="right:16%; bottom:16%; animation-delay:1.5s;">🦋</div>
  <div id="title-logo">にじいろ<br>宝石工房<span class="sub">〜 ゆびで けずって ひからせよう 〜</span></div>
  <div id="title-gem">💎</div>
  <button id="start-btn">▶ はじめる</button>
</div>

<div id="hud">
  <div id="top-left">
    <button class="round-btn" id="sound-btn">🔊</button>
    <button class="round-btn" id="spin-btn">🔄</button>
  </div>

  <div id="counter">
    <div class="row"><span>💎</span><span id="facet-count">0</span><span style="font-size:3.2vmin;">めん</span></div>
    <div id="shine-bar"><div id="shine-fill"></div></div>
    <div id="next-hint"></div>
  </div>

  <div id="bottom-bar">
    <div id="palette"></div>
    <button id="new-btn">✨ あたらしい いし</button>
  </div>
</div>

<div id="hint"></div>
<div id="banner"></div>

<div id="confirm">
  <div id="confirm-card">
    <p>いまの ほうせきと おわかれして<br>あたらしい いしに する？</p>
    <div class="btns">
      <button id="confirm-yes">する</button>
      <button id="confirm-no">やめる</button>
    </div>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script src="src/fx.js"></script>
<script src="src/audio.js"></script>
<script src="src/convex.js"></script>
<script src="src/gem.js"></script>
<script src="src/room.js"></script>
<script src="src/rewards.js"></script>
<script src="src/main.js"></script>
</body>
</html>
